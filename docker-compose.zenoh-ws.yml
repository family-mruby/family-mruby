# Let the browser build of Family mruby (wasm) reach the zenohd router
# (fmruby-core/doc/ruby_asterism, B1). A web page cannot open a TCP socket,
# so zenoh-pico in the browser talks to the router over WebSocket: this adds
# a ws/ listener (port 7449) next to the usual tcp/ one (7447). No plugin is
# needed; the WebSocket link is part of zenohd.
#
#   docker compose -f docker-compose.yml -f docker-compose.zenoh-ws.yml up -d zenohd
#
# With a board on the LAN as well, put this file LAST (docker-compose.zenoh-
# lan.yml replaces the port list, so a file before it would lose 7449):
#
#   docker compose -f docker-compose.yml -f docker-compose.zenoh-lan.yml \
#     -f docker-compose.zenoh-ws.yml up -d zenohd
#
# The browser build then connects to ws/localhost:7449 (its default; another
# router is given with ?zenoh=ws/<host>:<port> in the page's URL).
#
# The WebSocket port is published on loopback only: the router has no
# authentication, and a page served over https needs wss:// anyway, which is
# a TLS-terminating proxy in front of this port (B2), not this file.
#
# A listener given on the command line replaces zenohd's default one, so the
# tcp/ endpoint is listed again, and the command repeats docker-compose.yml's
# (an overlay replaces a command, it cannot append to it). Keep the two in
# step. Not for use with docker-compose.relay.yml, which gives zenohd a
# configuration file of its own.
services:
  zenohd:
    command:
      - --rest-http-port=8000
      - --no-multicast-scouting
      - '--cfg=plugins/storage_manager/storages/fmrb:{key_expr:"fmrb/**",volume:"memory"}'
      - --listen=tcp/[::]:7447
      - --listen=ws/[::]:7449
    ports:
      - "127.0.0.1:7449:7449"
