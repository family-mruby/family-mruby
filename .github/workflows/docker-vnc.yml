name: Build and Push VNC Desktop Image

on:
  push:
    tags:
      - '[0-9]*'
  # Manual rebuild: lets a Dockerfile/workflow fix produce the image for an
  # existing release tag without re-tagging (which would re-fire the firmware
  # release workflow as well).
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image version tag to publish (e.g. 2.0.0)'
        required: true
        type: string

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/fmruby-desktop
  VERSION: ${{ github.event.inputs.image_tag || github.ref_name }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.vnc
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.VERSION }}-${{ matrix.suffix }}

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check if latest tag
        id: check_latest
        run: |
          LATEST=$(git tag -l '[0-9]*' | sort -V | tail -n1)
          if [ "${{ env.VERSION }}" = "${LATEST}" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          docker manifest create ${{ env.IMAGE_NAME }}:${VERSION} \
            ${{ env.IMAGE_NAME }}:${VERSION}-amd64 \
            ${{ env.IMAGE_NAME }}:${VERSION}-arm64
          docker manifest push ${{ env.IMAGE_NAME }}:${VERSION}

      - name: Update latest tag
        if: steps.check_latest.outputs.is_latest == 'true'
        run: |
          docker manifest create ${{ env.IMAGE_NAME }}:latest \
            ${{ env.IMAGE_NAME }}:${VERSION}-amd64 \
            ${{ env.IMAGE_NAME }}:${VERSION}-arm64
          docker manifest push ${{ env.IMAGE_NAME }}:latest
