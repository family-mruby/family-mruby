name: Release Firmware to Installer

# Builds the ESP32 firmwares (fmruby-core for NARYAv3, StickS3, AtomS3R and
# Tab5; fmruby-graphics-audio) on a semver-style tag push and stages them into
# the family-mruby-installer repo. The Linux packages (.deb, amd64 and arm64)
# are built beside them and attached to this repository's GitHub release.
#
# Build environment matches local development and the per-repo CI:
#   - Uses the prebuilt ghcr.io/family-mruby/fmruby-esp32-build image
#   - ESP-IDF version is taken from fmruby-core/.env (ESP_IDF_VERSION=...)
#   - rake build:esp32 inside each sub-repo runs docker run on that image
#
# The source revisions used for the build are pinned in `.repos` (each
# repository has its own `version` field), so update `.repos` and commit
# before tagging this repo to control which sub-repo refs go into the release.
#
# Required secret: INSTALLER_DEPLOY_KEY
#   - SSH private key matching a Deploy Key (write-enabled) on the
#     family-mruby/family-mruby-installer repository.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to publish (e.g. 0.2.0)'
        required: true
        type: string

env:
  INSTALLER_REPO: family-mruby/family-mruby-installer
  ESP32_BUILD_IMAGE: ghcr.io/family-mruby/fmruby-esp32-build

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read

    steps:
      - name: Install release dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends jq openssh-client gcc-multilib

      - name: Checkout family-mruby
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Determine release version
        id: ver
        run: |
          VER="${{ github.event.inputs.version || github.ref_name }}"
          if [[ ! "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$VER' is not in MAJOR.MINOR.PATCH form"
            exit 1
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "Publishing firmware ${VER}"

      - name: Fetch source repos pinned in .repos
        run: |
          # Some submodules (e.g. fmruby-graphics-audio's LovyanGFX) use
          # git@github.com: URLs. The runner has no SSH key for those public
          # repos, so rewrite to HTTPS only while rake fetch runs and unset
          # right after, leaving SSH intact for the installer-repo deploy key.
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          rake fetch
          git config --global --unset url."https://github.com/".insteadOf

      - name: Resolve ESP-IDF image tag from fmruby-core/.env
        id: idf
        run: |
          ESP_IDF_VERSION=$(grep '^ESP_IDF_VERSION=' fmruby-core/.env | cut -d= -f2 | tr -d '[:space:]')
          if [[ -z "$ESP_IDF_VERSION" ]]; then
            echo "::error::Could not read ESP_IDF_VERSION from fmruby-core/.env"
            exit 1
          fi
          echo "version=${ESP_IDF_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Build image: ${ESP32_BUILD_IMAGE}:${ESP_IDF_VERSION}"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and tag esp32-build image
        env:
          IDF_VER: ${{ steps.idf.outputs.version }}
        run: |
          docker pull "${ESP32_BUILD_IMAGE}:${IDF_VER}"
          # Rakefile defaults to :latest, so retag the pinned version as :latest
          # to keep both sub-repos using the exact same image we just pulled.
          docker tag "${ESP32_BUILD_IMAGE}:${IDF_VER}" "${ESP32_BUILD_IMAGE}:latest"

      - name: Build fmruby-core (ESP32-S3 / Retro)
        working-directory: fmruby-core
        run: rake build:esp32

      - name: Stash the S3 build before the next build reuses build/
        working-directory: fmruby-core
        run: bash "$GITHUB_WORKSPACE/.github/scripts/stash-core-build.sh" build-s3

      # The target comes from .env, which overrides the environment (a CLI
      # FMRB_HW_TARGET would be silently ignored), so each build edits the
      # file itself and checks that exactly one active target remains. The
      # Rakefile adds each board's build defaults (Asterism, the mini
      # configuration of the headless boards) from the target.
      - name: Build fmruby-core (ESP32-S3 / StickS3, headless)
        working-directory: fmruby-core
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/select-core-target.sh" STICKS3
          rake clean_all
          rake build:esp32
          bash "$GITHUB_WORKSPACE/.github/scripts/stash-core-build.sh" build-sticks3

      - name: Build fmruby-core (ESP32-S3 / AtomS3R, headless)
        working-directory: fmruby-core
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/select-core-target.sh" ATOMS3R
          rake clean_all
          rake build:esp32
          bash "$GITHUB_WORKSPACE/.github/scripts/stash-core-build.sh" build-atoms3r

      - name: Build fmruby-core (ESP32-P4 / Tab5)
        working-directory: fmruby-core
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/select-core-target.sh" TAB5
          rake clean_all
          rake build:esp32

      - name: Build fmruby-graphics-audio (ESP32 / WROVER)
        working-directory: fmruby-graphics-audio
        run: rake build:esp32

      - name: Setup SSH for installer repo
        env:
          DEPLOY_KEY: ${{ secrets.INSTALLER_DEPLOY_KEY }}
        run: |
          if [[ -z "$DEPLOY_KEY" ]]; then
            echo "::error::INSTALLER_DEPLOY_KEY secret is not set"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null

      - name: Clone installer repo
        run: |
          git clone "git@github.com:${INSTALLER_REPO}.git" installer
          cd installer
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Stage firmware into installer
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          cd installer
          FMRUBY_CORE_BUILD="$GITHUB_WORKSPACE/fmruby-core/build-s3" \
          FMRUBY_CORE_TAB5_BUILD="$GITHUB_WORKSPACE/fmruby-core/build" \
          FMRUBY_CORE_STICKS3_BUILD="$GITHUB_WORKSPACE/fmruby-core/build-sticks3" \
          FMRUBY_CORE_ATOMS3R_BUILD="$GITHUB_WORKSPACE/fmruby-core/build-atoms3r" \
          FMRUBY_GFX_BUILD="$GITHUB_WORKSPACE/fmruby-graphics-audio/build" \
          bash scripts/stage-firmware.sh "$VER"

      - name: Update versions.json
        working-directory: installer
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          jq --arg ver "$VER" --arg date "$TODAY" '
            .default = $ver
            | if (.versions | map(.tag) | index($ver)) then
                .
              else
                .versions |= ([{tag: $ver, released: $date}] + .)
              end
          ' versions.json > versions.json.tmp
          mv versions.json.tmp versions.json
          cat versions.json

      - name: Commit and push
        working-directory: installer
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          git add "firmware/${VER}" versions.json
          if git diff --staged --quiet; then
            echo "No changes to commit (firmware ${VER} already published)"
            exit 0
          fi
          git commit -m "Release firmware ${VER} from family-mruby tag"
          git push origin HEAD:main

  linux-deb:
    # The Linux version's packages (doc/linux_native/): built in the package
    # build image (Ubuntu 26.04 for amd64, Debian trixie cross-compiling for
    # arm64) by rake native:deb, which also scans the package tree (no
    # untracked file, no credential).
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    permissions:
      contents: read
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-multilib

      - name: Checkout family-mruby
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Fetch source repos pinned in .repos
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          rake fetch
          git config --global --unset url."https://github.com/".insteadOf

      - name: Build the .deb
        working-directory: fmruby-core
        run: |
          rake native:deb ARCH=${{ matrix.arch }}
          ls -l native/build-deb/

      - name: Upload the .deb
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: fmruby-core/native/build-deb/family-mruby_*_${{ matrix.arch }}.deb
          if-no-files-found: error

  github-release:
    # The GitHub release of this repository for the tag, with the Linux
    # packages attached. Runs after the firmware is published.
    needs: [build-and-publish, linux-deb]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download the packages
        uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          merge-multiple: true
          path: debs

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          ls -l debs
          if gh release view "$VER" -R "${{ github.repository }}" > /dev/null 2>&1; then
            gh release upload "$VER" debs/*.deb --clobber -R "${{ github.repository }}"
          else
            gh release create "$VER" debs/*.deb -R "${{ github.repository }}" \
              --title "Family mruby $VER" \
              --notes "Firmware: https://family-mruby.github.io/family-mruby-installer/ (Web Installer). Linux: the .deb files below (amd64: Ubuntu 26.04 or newer; arm64: Debian trixie)."
          fi
