[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
user=root

[program:vnc]
command=su - fmruby -c "vncserver :1 -geometry 1024x768 -depth 24 -localhost no -SecurityTypes None --I-KNOW-THIS-IS-INSECURE -fg"
autorestart=true
priority=10
stdout_logfile=/tmp/vnc.log
stderr_logfile=/tmp/vnc-err.log

[program:novnc]
command=websockify --web=/usr/share/novnc/ 6080 localhost:5901
autorestart=true
priority=20
stdout_logfile=/tmp/novnc.log
stderr_logfile=/tmp/novnc-err.log

[program:fmruby]
command=su - fmruby -c "DISPLAY=:1 /opt/fmruby/start-fmruby.sh"
autorestart=false
priority=30
startsecs=5
startretries=3
stdout_logfile=/tmp/fmruby-supervisor.log
stderr_logfile=/tmp/fmruby-supervisor-err.log
