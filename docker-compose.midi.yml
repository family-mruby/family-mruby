# General MIDI output for the simulation.
#
#   docker compose -f docker-compose.yml -f docker-compose.wsl.yml \
#                  -f docker-compose.midi.yml up -d
#
# Then open the MIDI APU app and press "7 Out" to send the music to the
# serial MIDI port instead of the APU. The bytes go through
# fmruby-core/midi_out.fifo, which this service reads and plays.
#
# Use the same -f set when stopping, or this service's container is left
# behind while the network is removed, and the next up fails with
# "network ... not found":
#   docker compose -f docker-compose.yml -f docker-compose.wsl.yml \
#                  -f docker-compose.midi.yml down
# Exporting COMPOSE_FILE once avoids having to remember:
#   export COMPOSE_FILE=docker-compose.yml:docker-compose.wsl.yml:docker-compose.midi.yml
#
# Without this service the same thing works from the host:
#   ruby tools/fmrb_midi_monitor.rb --fluidsynth
services:
  midi-gm:
    build:
      context: ./docker/midi-gm
    container_name: fmruby_midi_gm
    # WSLg's PulseAudio socket belongs to the host user; root is refused.
    user: "${UID:-1000}:${GID:-1000}"
    init: true
    stop_grace_period: 2s
    environment:
      # Same audio path as sdl2-display under WSL; harmless elsewhere.
      - PULSE_SERVER=unix:/mnt/wslg/runtime-dir/pulse/native
      - XDG_RUNTIME_DIR=/mnt/wslg/runtime-dir
    volumes:
      - ./fmruby-core:/project
      - ./tools:/tools:ro
      - /mnt/wslg:/mnt/wslg
